services:
  - type: web
    name: promobet-games-api
    runtime: node
    region: ohio
    plan: free
    branch: promobet/site-setup
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm nx build games-api
    startCommand: pnpm exec prisma db push && node dist/apps/games-api/main.js
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: PNPM_VERSION
        value: 11.9.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: promobet-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: promobet-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: promobet-redis
          property: port
      - key: RABBITMQ_URL
        value: ""
  - type: web
    name: promobet-admin-api
    runtime: node
    region: ohio
    plan: free
    branch: promobet/site-setup
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm nx build admin-api
    startCommand: pnpm exec prisma db push && pnpm db:seed && node dist/apps/admin-api/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: PNPM_VERSION
        value: 11.9.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: promobet-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: keyvalue
          name: promobet-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: keyvalue
          name: promobet-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@promobet.bet
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: CORS_ORIGINS
        value: https://promobet-admin.onrender.com
  - type: web
    name: promobet-admin
    runtime: static
    branch: promobet/site-setup
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm nx build admin-web
    staticPublishPath: dist/apps/admin-web
    envVars:
      - key: NODE_VERSION
        value: 24.14.0
      - key: PNPM_VERSION
        value: 11.9.0
      - key: VITE_API_BASE_URL
        value: https://promobet-admin-api.onrender.com
  - type: keyvalue
    name: promobet-redis
    region: ohio
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: off
databases:
  - name: promobet-db
    databaseName: promobet_db
    plan: free
    region: ohio
